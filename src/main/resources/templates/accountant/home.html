<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accountant Home</title>
    <link rel="stylesheet" th:href="@{/accountant/home.css}">
</head>

<body>

<nav class="navbar">
    <div class="navbar-brand">
        Hệ thống cung cấp nhân công
    </div>

    <div class="navbar-user">
        <div class="user-info">
            <div class="user-name" th:text="${username}"></div>
            <div class="user-role">Nhân viên kế toán</div>
        </div>

        <a th:href="@{/auth/logout}" class="btn-logout">Đăng xuất</a>
    </div>
</nav>

<div class="container">

    <!-- Alert success -->
    <div class="alert alert-success" th:if="${success != null}">
        <span th:text="${success}"></span>
    </div>

    <div class="welcome-card">
        <h1 th:text="'Xin chào, ' + ${fullname} + '!'"></h1>
        <p>Chào mừng bạn đến với hệ thống kế toán. Bạn có thể quản lý hóa đơn, thanh toán và theo dõi các ca làm việc từ đây.</p>
    </div>

    <div class="dashboard-grid">
        <a th:href="@{/accountant/search-partner}" class="dashboard-card">
            <h3>Nhận Thanh toán</h3>
            <p>Xử lý và theo dõi các khoản thanh toán từ đối tác</p>
        </a>
    </div>

</div>

</body>
</html>
