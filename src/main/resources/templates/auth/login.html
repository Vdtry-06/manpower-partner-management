<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Hệ thống cung cấp nhân công</title>
    <link rel="stylesheet" th:href="@{/auth/login.css}">
</head>
<body>
<div class="login-container" >
    <div class="login-header">
        <h1> Hệ thống cung cấp nhân công </h1>
        <p>Đăng nhập vào hệ thống</p>
    </div>

    <div class="login-body">
        <div th:if="${error}" th:text="${error}" style="color:red; margin-bottom:10px;"></div>

        <div th:if="${param.logout}" style="color:green; margin-bottom:10px;">
            Đăng xuất thành công!
        </div>

        <form th:action="@{/auth/login}" method="post">
            <div class="form-group">
                <label for="username">Tên đăng nhập</label>
                <input type="text" id="username" name="username" placeholder="Nhập tên đăng nhập" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
            </div>

            <button type="submit" class="btn-login">Đăng nhập</button>
        </form>
    </div>

    <div class="login-footer">
        @ 2025 Hệ thống cung cấp nhân công. Từ vdtry06.
    </div>
</div>
</body>
</html>
